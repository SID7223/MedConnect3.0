<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedConnect — Splash Screen (Fixed)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px;
    background:#0d0f0e; font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#e8ece9; padding:32px;
  }
  h1 { font-size:15px; font-weight:600; letter-spacing:.4px; color:#9fb3a8; text-transform:uppercase; }
  .phone {
    width:300px; height:620px; border-radius:44px; overflow:hidden;
    border:10px solid #1c1f1e; box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 2px #2a2e2c;
    position:relative; background:#1f4d3f;
  }
  .notch {
    position:absolute; top:12px; left:50%; transform:translateX(-50%);
    width:110px; height:26px; background:#1c1f1e; border-radius:14px; z-index:5;
  }
  .splash {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:#1f4d3f;
  }
  .splash img { width:52%; height:52%; object-fit:contain; display:block; border-radius:50%; }
  .caption { font-size:13px; color:#7d8f86; text-align:center; line-height:1.6; max-width:340px; }
  .caption code { background:#1a1d1c; padding:2px 7px; border-radius:5px; color:#a8c4b5; font-size:12px; }
  .badge { display:inline-block; background:#1f4d3f; color:#cfe8db; font-size:11px; font-weight:600; padding:4px 12px; border-radius:20px; letter-spacing:.5px; }
  .fixed { display:inline-block; background:#1a3d2a; color:#7fd6a4; font-size:11px; font-weight:600; padding:4px 12px; border-radius:20px; letter-spacing:.5px; }
</style>
</head>
