<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedConnect — Splash Mockups</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; background:#0b0d0c; color:#e8ece9;
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    padding:36px 24px; display:flex; flex-direction:column; align-items:center; gap:32px;
  }
  .label { font-size:12px; font-weight:600; letter-spacing:2px; color:#7d8f86; text-transform:uppercase; }
  .grid { display:flex; flex-wrap:wrap; gap:36px; justify-content:center; align-items:flex-start; }
  .mock { display:flex; flex-direction:column; align-items:center; gap:12px; }
  .mock .name { font-size:11px; color:#5f7168; letter-spacing:1px; text-transform:uppercase; }

  .frame { position:relative; overflow:hidden; background:radial-gradient(ellipse 90% 60% at 50% 40%, #f2f8f4 0%, #ffffff 55%); border:8px solid #161918; box-shadow:0 30px 80px rgba(0,0,0,.65), 0 0 0 2px #2a2e2c; }
  .frame .notch { position:absolute; background:#161918; z-index:5; }

  .splash { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .logo-card { background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 14px 38px rgba(31,77,63,.15), 0 3px 10px rgba(31,77,63,.07); }
  .logo-card img { display:block; }
  .wordmark { font-family:Georgia,'Times New Roman',serif; font-weight:700; color:#16402f; }
  .divider { height:2.5px; border-radius:2px; background:linear-gradient(90deg,#2e7d5b,#16402f); }
  .tagline { font-weight:500; color:#8aa396; text-transform:uppercase; }
  .loader { display:flex; gap:6px; }
  .loader span { border-radius:50%; background:#2e7d5b; animation:pulse 1.2s ease-in-out infinite; }
  .loader span:nth-child(2){ animation-delay:.18s; }
  .loader span:nth-child(3){ animation-delay:.36s; }
  @keyframes pulse { 0%,100%{opacity:.25;transform:scale(.8);} 50%{opacity:1;transform:scale(1.15);} }

  /* Mobile portrait 393x852 -> frame 300x652 */
  .mp { width:300px; height:652px; border-radius:44px; }
  .mp .notch { top:12px; left:50%; transform:translateX(-50%); width:104px; height:24px; border-radius:13px; }
  .mp .splash { flex-direction:column; }
  .mp .logo-card { width:96px; height:96px; border-radius:26px; }
  .mp .logo-card img { width:70px; height:70px; }
  .mp .wordmark { font-size:24px; margin-top:26px; }
  .mp .divider { width:32px; margin-top:12px; }
  .mp .tagline { font-size:8.5px; letter-spacing:2px; margin-top:12px; }
  .mp .loader { position:absolute; bottom:52px; left:50%; transform:translateX(-50%); }
  .mp .loader span { width:6px; height:6px; }

  /* Mobile landscape 852x393 -> frame 640x295 */
  .ml { width:640px; height:295px; border-radius:28px; }
  .ml .notch { top:50%; left:12px; transform:translateY(-50%); width:24px; height:104px; border-radius:13px; }
  .ml .splash { flex-direction:row; gap:28px; }
  .ml .logo-card { width:76px; height:76px; border-radius:20px; }
  .ml .logo-card img { width:55px; height:55px; }
  .ml .wordmark { font-size:21px; }
  .ml .divider { width:28px; height:2px; margin-top:10px; }
  .ml .tagline { font-size:8px; letter-spacing:1.8px; margin-top:10px; }
  .ml .text-col { display:flex; flex-direction:column; align-items:flex-start; }
  .ml .loader { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); }
  .ml .loader span { width:5px; height:5px; }

  /* Tablet portrait 834x1194 -> frame 420x596 */
  .tp { width:420px; height:596px; border-radius:36px; }
  .tp .notch { top:10px; left:50%; transform:translateX(-50%); width:88px; height:20px; border-radius:11px; }
  .tp .splash { flex-direction:column; }
  .tp .logo-card { width:128px; height:128px; border-radius:32px; }
  .tp .logo-card img { width:94px; height:94px; }
  .tp .wordmark { font-size:31px; margin-top:32px; }
  .tp .divider { width:42px; margin-top:14px; }
  .tp .tagline { font-size:10.5px; letter-spacing:2.4px; margin-top:14px; }
  .tp .loader { position:absolute; bottom:60px; left:50%; transform:translateX(-50%); }
  .tp .loader span { width:7px; height:7px; }

  /* Tablet landscape 1194x834 -> frame 640x446 */
  .tl { width:640px; height:446px; border-radius:28px; }
  .tl .notch { top:50%; left:10px; transform:translateY(-50%); width:20px; height:88px; border-radius:11px; }
  .tl .splash { flex-direction:row; gap:36px; }
  .tl .logo-card { width:104px; height:104px; border-radius:26px; }
  .tl .logo-card img { width:76px; height:76px; }
  .tl .wordmark { font-size:27px; }
  .tl .divider { width:36px; height:2.5px; margin-top:12px; }
  .tl .tagline { font-size:9.5px; letter-spacing:2.2px; margin-top:12px; }
  .tl .text-col { display:flex; flex-direction:column; align-items:flex-start; }
  .tl .loader { position:absolute; bottom:40px; left:50%; transform:translateX(-50%); }
  .tl .loader span { width:6px; height:6px; }
</style>
</head>
