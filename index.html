<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap" rel="stylesheet" />
    <title>MedPeers | Find your exam study partner</title>
    <meta name="description" content="Find your exam study partner, worldwide. Connect. Study. Succeed." />

    <!-- PWA -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#225041" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MedPeers" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app-splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#f1f4f0;transition:opacity .4s ease;">
      <img src="/pwa-192.png" alt="MedPeers" style="width:84px;height:84px;border-radius:20px;" />
      <div style="font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:30px;letter-spacing:-0.5px;color:#1f4d3f;">MedPeers</div>
      <div style="font-size:12.5px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#c0392b;">Connect. Study. Succeed.</div>
    </div>
    <div id="root"></div>
    <script src="https://unpkg.com/@daily-co/daily-js"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the service worker (required for PWA install / PWABuilder).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch(function (e) {
            console.log('SW registration failed:', e);
          });
        });
      }
    </script>
  </body>
</html>
