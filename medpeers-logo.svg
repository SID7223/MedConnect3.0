<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Playfair+Display:wght@500&amp;display=swap');
      .serif-text {
        font-family: 'Playfair Display', 'Times New Roman', 'Georgia', serif;
      }
      .cursive-text {
        font-family: 'Great Vibes', 'Brush Script MT', 'Bickham Script Pro', 'Edwardian Script ITC', cursive;
      }
    </style>
  </defs>

  <!-- Transparent canvas background wrapper -->
  <rect width="100%" height="100%" fill="none" />

  <!-- Main Dark Green Circle Badge -->
  <circle cx="250" cy="250" r="230" fill="#0B3C2A" />

  <!-- Elegant Inner Beige Thin Border Ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#F5F2EB" stroke-width="1.5" opacity="0.7" />

  <!-- "Med" text in Sentence Case using Collins Serif Style -->
  <text x="250" y="210" class="serif-text" font-family="'Playfair Display', 'Times New Roman', 'Georgia', serif" font-size="52" font-weight="normal" fill="#F5F2EB" text-anchor="middle" letter-spacing="2">Med</text>

  <!-- "Peers" text in Elegant Connected Cursive Script Style -->
  <text x="250" y="310" class="cursive-text" font-family="'Great Vibes', 'Brush Script MT', 'Bickham Script Pro', 'Edwardian Script ITC', cursive" font-size="78" font-style="italic" font-weight="normal" fill="#F5F2EB" text-anchor="middle">Peers</text>
</svg>
